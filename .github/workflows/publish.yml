name: Publish ManagementLoggingClient to NuGet

on:
  push:
    tags:
      - 'v*'   # v2.0.1, v2.1.0, v3.0.0-beta.1 ...

permissions:
  contents: write   # Required to create the GitHub Release
  id-token: write   # Required for NuGet Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDKs (8 + 10, multi-target)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore, Build and Pack
        run: |
          dotnet restore
          dotnet build -c Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet pack -c Release --no-build -p:Version=${{ steps.version.outputs.VERSION }} -o ./artifacts

      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name, NOT email

      - name: Publish package to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ManagementLoggingClient ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          files: ./artifacts/*.nupkg
